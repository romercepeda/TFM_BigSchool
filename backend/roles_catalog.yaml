# Roles & permissions catalog — Spec D11 §3, §5
#
# Loaded at startup and upserted by code (stable key = `code`). This file is the
# single source of truth for which permissions exist and which role holds which
# permission. Adding a permission or role here (plus the matching i18n keys and,
# if it gates a new endpoint, a require_permission("...") call) is all that is
# required — no change to the permission-check logic itself (D11 §3).
#
# name_key / description_key resolve through the i18n system (Spec D08).
# Permission descriptions are English-only in v1 (D11 §4.1).

