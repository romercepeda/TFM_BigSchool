  - code: system.view_audit_log
    name_key: "permission.system.view_audit_log.name"
    description_key: "permission.system.view_audit_log.description"
  # Added during Changeset C02 §5 instrumentation: POST /market-data/daily-update
  # (Spec D09 §6) triggers the price/indicator/alert job across every user's
  # holdings — a global, shared-rate-limit operation with no per-user ownership
  # scope, so it needs its own admin-only permission rather than reusing a
  # holding.*/portfolio.* code that would wrongly grant it to Investor.
  - code: system.run_jobs
    name_key: "permission.system.run_jobs.name"
    description_key: "permission.system.run_jobs.description"

roles:

  # Holds every permission in the catalog (D11 §5.2). The list below is kept
  # explicit (not "all permissions" magic) so the file stays the single source
  # of truth and a diff here is always meaningful.
  - code: administrator
    name_key: "role.administrator.name"
    description_key: "role.administrator.description"
    is_default: false
    is_admin_role: true
    permissions:
      - portfolio.list
      - portfolio.create
      - portfolio.rename
      - portfolio.archive
      - portfolio.restore
      - portfolio.delete_permanent
      - holding.view
      - holding.add_asset
      - holding.delete
      - lot.create
      - lot.edit
      - lot.delete
      - sale.create
      - sale.edit
      - sale.delete
      - price_level.view
      - price_level.create
      - price_level.edit
      - price_level.delete
      - analysis.upload
      - analysis.view
      - analysis.edit
      - analysis.delete
      - settings.view_own
      - settings.edit_own
      - user.list
      - user.view_any
      - user.change_own_password
      - user.change_any_password
      - role.list
      - role.assign
      - role.revoke
      - system.view_config
      - system.view_audit_log
      - system.run_jobs

  # The typical personal-portfolio user (D11 §5.2). Auto-assigned to every new
  # registration (D11 §6.2). Does not hold any user.*/role.*/system.* permission.
  - code: investor
    name_key: "role.investor.name"
    description_key: "role.investor.description"
    is_default: true
    is_admin_role: false
    permissions:
      - portfolio.list
      - portfolio.create
      - portfolio.rename
      - portfolio.archive
      - portfolio.restore
      - portfolio.delete_permanent
      - holding.view
      - holding.add_asset
      - holding.delete
      - lot.create
      - lot.edit
      - lot.delete
      - sale.create
      - sale.edit
      - sale.delete
      - price_level.view
      - price_level.create
      - price_level.edit
      - price_level.delete
      - analysis.upload
      - analysis.view
      - analysis.edit
      - analysis.delete
      - settings.view_own
      - settings.edit_own
      - user.change_own_password
