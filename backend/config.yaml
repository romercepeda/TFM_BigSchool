# BigSchool — application configuration
# All tunable behavioral values live here (not secrets — those go in .env).
# See specs/00-engineering/spec-00f-global-configuration.md for the full spec.
#
# Changing any value here requires a backend restart to take effect.

portfolios:
  max_active_per_user: 10
  name_max_length: 60

uploads:
  max_file_size_mb: 20

authentication:
  methods:
    google:
      enabled: true
    microsoft:
      enabled: true
    password:
      enabled: true
    guest:
      enabled: true

indicators:
  scheduled_job:
    daily_run_hour_utc: 2

alerts:
  near_crossing_pct: 0.03

ai:
  provider: gemini
  anthropic:
    model: claude-opus-4-7
  openai:
    model: gpt-4o
  gemini:
    model: models/gemini-3-flash-preview
  per_call_timeout_seconds: 120
  notifications:
    poll_interval_seconds: 30

i18n:
  default_language: es
  supported_languages:
    - es
    - en

# Spec D12 §9 — `providers` (ordered cascade, first tried first) replaces the
# deprecated singular `provider` key. Old form, still readable for one release
# (Changeset C04 §7): `provider: twelve_data`
#
# Shipped default order per D12 §3. Requires MARKET_DATA_EODHD_API_KEY and
# MARKET_DATA_FINNHUB_API_KEY set in .env (Changeset C04 §8's startup check
# enforces this) — confirmed present as of Changeset C04 Step 7.
market_data:
  providers:
    - twelve_data
    - eodhd
    - finnhub
  failure_report_retention_days: 30
  twelve_data:
    base_url: https://api.twelvedata.com
    daily_call_budget: 800
  finnhub:
    base_url: https://finnhub.io/api/v1
    per_minute_call_budget: 60
  eodhd:
    base_url: https://eodhd.com/api
    daily_call_budget: 20
    max_lookback_days: 365

# Old form, still readable for one release (Changeset C04 §7): `provider: frankfurter`
fx_data:
  providers:
    - frankfurter
  frankfurter:
    base_url: https://api.frankfurter.dev/v2

security:
  default_admin_email: admin@portfolioia.local
  default_admin_password_length: 24
